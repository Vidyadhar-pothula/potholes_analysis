<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pothole Analyzer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 50px; background-color: #f5f5f7; color: #1d1d1f; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 24px; }
        .upload-area { border: 2px dashed #d2d2d7; padding: 40px 20px; border-radius: 8px; margin-bottom: 24px; transition: border-color 0.3s ease; }
        .upload-area:hover { border-color: #0066cc; }
        input[type="file"] { display: block; margin: 0 auto; }
        button { background: #0066cc; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: 500; border-radius: 6px; cursor: pointer; transition: background 0.3s ease; width: 100%; }
        button:hover { background: #0055b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Multi-Modal Pothole Analyzer</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="upload-area">
                <input type="file" name="file" accept="image/*" required>
            </div>
            <button type="submit">Analyze Image</button>
        </form>
    </div>
</body>
</html>
